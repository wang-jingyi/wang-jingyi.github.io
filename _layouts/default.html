<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {{ site.name_en }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Serif:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<nav class="nav">
  <div class="nav-inner">
    <a class="nav-name" href="{{ '/' | relative_url }}">{{ site.name_en }}</a>
    <div class="nav-links">
      {% for item in site.nav %}
      <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.name }}</a>
      {% endfor %}
    </div>
  </div>
</nav>

<main id="main">
{{ content }}
</main>

<footer>
  <p>{{ site.name_en }} · IS2 Lab, Zhejiang University · <a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
</footer>

</body>
</html>
