---
layout: default
---
<section class="hero">
  <div class="hero-text">
    <h1>{{ site.name_en }}{% if site.name_cn %}<span class="cn">{{ site.name_cn }}</span>{% endif %}</h1>
    <p class="hero-role">{{ site.role | markdownify | remove: '<p>' | remove: '</p>' | strip }}</p>
    <div class="contact-row">
      {% for link in site.profile_links %}<a href="{{ link.url }}">{{ link.name }}</a>{% endfor %}
    </div>
  </div>
  <img class="photo" src="{{ site.photo | relative_url }}" alt="{{ site.name_en }}" width="132" height="132">
</section>

<div class="prose" style="margin-top:48px;">
{{ content }}
</div>
