# Research themes.
#
# The `id` is what you put in a publication's `theme:` field. Change a name
# or blurb here and it updates on the home page, the openings page and the
# publication filters at once. Adding a fourth theme works the same way:
# give it an id, then start tagging papers with it.

- id: fm
  tag: FM
  filter: Formal methods foundations
  name: Formal methods & program analysis
  blurb: >-
    Model checking, theorem proving, symbolic execution and fuzzing.

- id: se4ai
  tag: SE4AI
  filter: SE4AI
  name: Software engineering for AI
  blurb: >-
    Testing, verification, and repair of neural networks, LLM
    applications and agents.

- id: ai4se
  tag: AI4SE
  filter: AI4SE
  name: AI for software engineering
  blurb: >-
    LLM-aided formal modelling and verification, agentic code generation for
    industrial control, prompting and function orchestration frameworks.
