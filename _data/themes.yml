# Research themes.
#
# The `id` is what you put in a publication's `theme:` field. Change a name
# or blurb here and it updates on the home page, the openings page and the
# publication filters at once. Adding a fourth theme works the same way:
# give it an id, then start tagging papers with it.

- id: fm
  tag: FM
  filter: Formal methods
  name: Formal methods & program analysis
  blurb: >-
    Model checking, refinement and rely-guarantee reasoning, executable
    semantics for industrial languages, symbolic execution and fuzzing.

- id: se4ai
  tag: SE4AI
  filter: SE4AI
  name: Software engineering for AI
  blurb: >-
    Testing, verification, debugging and repair of neural networks and LLM
    applications — robustness, fairness, backdoors, model copyright,
    unlearning and safety benchmarking.

- id: ai4se
  tag: AI4SE
  filter: AI4SE
  name: AI for software engineering
  blurb: >-
    LLM-aided modelling and verification, agentic code generation for
    industrial control, prompting and function orchestration frameworks.
